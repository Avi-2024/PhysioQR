name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'physioqr/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'physioqr/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: physioqr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: physioqr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Direct-patient fee input regression tests
        run: npm run test -- --run src/features/admin/pages/settings/AdminSettingsPage.test.tsx

      - name: Patient exercise video playback regression tests
        run: npm run test -- --run src/lib/exercise-video.test.ts

      - name: Patient dashboard and session-state regressions
        run: npm run test -- --run src/lib/patient-session.test.ts src/features/patients/pages/PatientDashboardPage.test.tsx

      - name: Agent doctor-wise visit and referral UI regression tests
        run: npm run test -- --run src/features/agents/pages/doctors/AgentDoctorsPage.test.tsx

      - name: Doctor dashboard patient recovery UI regression tests
        run: npm run test -- --run src/features/doctors/pages/dashboard/DoctorRecoveryOverviewPanel.test.tsx

      - name: Production build
        run: npm run build
